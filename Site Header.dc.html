<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
</helmet>

<sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
<div style="position: fixed; right: 16px; bottom: 16px; z-index: 50; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; font-family: 'Jost', system-ui, sans-serif;">
  <a href="Reach%20Out.dc.html" style="background: #f7f2ec; color: #2a2320; border: 1px solid #2a2320; text-decoration: none; font-weight: 500; font-size: 15px; padding: 13px 20px; box-shadow: 0 6px 20px rgba(42,35,32,0.25);" style-hover="background: #fff; color: #2a2320;">{{ talkLabel }} →</a>
  <button type="button" onClick="{{ quickExit }}" style="all: unset; cursor: pointer; background: #c8102e; color: #fff; font-weight: 600; font-size: 13px; letter-spacing: 0.12em; padding: 14px 20px; box-shadow: 0 6px 20px rgba(42,35,32,0.25);" style-hover="background: #a00d25;">{{ exitLabel }} ✕ <span style="font-weight: 400; opacity: 0.8; letter-spacing: 0.04em;">{{ escLabel }}</span></button>
</div>
<nav style="background: #f7f2ec; border-bottom: 1px solid #e2d8cd; font-family: 'Jost', system-ui, sans-serif; color: #2a2320;">
  <div style="max-width: 1320px; margin: 0 auto; padding: 14px clamp(20px, 4vw, 48px); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px clamp(16px, 2.4vw, 40px);">
    <a href="Survivor%20Lawyer%20Home%20v2.dc.html" style="display: flex; flex-direction: column; align-items: flex-start; flex-shrink: 0; text-decoration: none; line-height: 1; color: #2a2320;">
      <img src="assets/logo-coral-script.png" alt="Jessica Pride" style="display: block; height: 62px; width: 172px; max-width: none; flex-shrink: 0; object-fit: contain; align-self: flex-start;"><span style="font-size: 9.5px; letter-spacing: 0.2em; margin-top: 6px; color: #6f625a; white-space: nowrap;">YOUR SEXUAL ASSAULT ATTORNEY</span>
    </a>
    <div style="order: {{ linksOrder }}; flex: {{ linksFlex }}; min-width: 0; display: flex; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; align-items: center; justify-content: {{ linksJustify }}; gap: 8px clamp(14px, 1.8vw, 28px); font-size: 15px; font-weight: 500; white-space: nowrap; border-top: {{ linksBorder }};">
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="5">
        <a href="{{ l.href }}" aria-current="{{ l.current }}" style="text-decoration: none; color: {{ l.color }}; border-bottom: 2px solid {{ l.line }}; height: 44px; box-sizing: border-box; display: flex; align-items: center; padding-top: 2px;" style-hover="color: #e2673e;">{{ l.label }}</a>
      </sc-for>
      <a href="Heal%20and%20Learn.dc.html#self-care" style="text-decoration: none; border: 1px solid #e2673e; color: #e2673e; border-radius: 99px; height: 36px; box-sizing: border-box; display: flex; align-items: center; padding: 0 16px; font-size: 13px; font-weight: 600; letter-spacing: 0.1em; white-space: nowrap;" style-hover="background: #e2673e; color: #fff;">{{ careLabel }}</a>
    </div>
    <div style="order: 2; display: flex; flex-wrap: nowrap; align-items: center; justify-content: flex-end; gap: 14px;">
      <a href="Attorneys.dc.html" style="border: 1px solid #2a2320; color: #2a2320; text-decoration: none; font-weight: 500; font-size: 14px; height: 44px; box-sizing: border-box; display: flex; align-items: center; padding: 0 16px; white-space: nowrap;" style-hover="border-color: #e2673e; color: #e2673e;">{{ attyLabel }}</a>
      <a href="Reach%20Out.dc.html" style="background: #e2673e; color: #fff; text-decoration: none; font-weight: 500; font-size: 15px; height: 44px; box-sizing: border-box; display: flex; align-items: center; padding: 0 22px; white-space: nowrap;" style-hover="background: #c9532c; color: #fff;">{{ reachLabel }}</a>
    </div>
  </div>
</nav>
</sc-if>

<sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
<nav style="background: rgba(247,242,236,0.94); backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid {{ navBorder }}; box-shadow: {{ navShadow }}; font-family: 'Jost', system-ui, sans-serif; color: #2a2320; transform: {{ navShift }}; transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.3s ease, border-color 0.3s ease;">
  <div style="height: 52px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px;">
    <a href="Survivor%20Lawyer%20Home%20v2.dc.html" aria-label="Jessica Pride, home" style="display: flex; align-items: center; text-decoration: none; transition: opacity 0.2s ease;" style-active="opacity: 0.6;">
      <img src="assets/logo-coral-script.png" alt="Jessica Pride" style="display: block; height: 30px; width: 86px; object-fit: contain;">
    </a>
    <div style="display: flex; align-items: center; gap: 6px;">
      <a href="tel:6195168166" aria-label="Call 619-516-8166" style="height: 36px; padding: 0 14px; display: flex; align-items: center; border: 1px solid #2a2320; border-radius: 99px; color: #2a2320; text-decoration: none; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; box-sizing: border-box; transition: background 0.2s ease, color 0.2s ease, transform 0.15s ease;" style-hover="background: #2a2320; color: #f7f2ec;" style-active="transform: scale(0.95);">{{ callLabel }}</a>
      <button type="button" onClick="{{ toggleMenu }}" aria-expanded="{{ menuOpen }}" aria-label="Menu" style="all: unset; cursor: pointer; width: 36px; height: 36px; border-radius: 99px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: #2a2320; transition: background 0.2s ease, transform 0.15s ease;" style-hover="background: #e2673e;" style-active="transform: scale(0.92);">
        <span style="display: block; width: 15px; height: 1.5px; background: #f7f2ec; transform: {{ bar1 }}; transition: transform 0.3s ease;"></span>
        <span style="display: block; width: 15px; height: 1.5px; background: #f7f2ec; opacity: {{ bar2 }}; transition: opacity 0.2s ease;"></span>
        <span style="display: block; width: 15px; height: 1.5px; background: #f7f2ec; transform: {{ bar3 }}; transition: transform 0.3s ease;"></span>
      </button>
    </div>
  </div>
</nav>
<div onClick="{{ closeMenu }}" aria-hidden="true" style="position: fixed; inset: 0; z-index: 39; background: rgba(31,26,23,0.45); opacity: {{ scrimOpacity }}; pointer-events: {{ scrimEvents }}; transition: opacity 0.35s ease;"></div>
<div role="dialog" aria-label="Menu" style="position: fixed; top: 52px; right: 0; bottom: 52px; width: min(86vw, 360px); z-index: 40; background: #f7f2ec; overflow-y: auto; padding: 6px 22px 24px; box-sizing: border-box; display: flex; flex-direction: column; font-family: 'Jost', system-ui, sans-serif; box-shadow: -12px 0 30px rgba(31,26,23,0.18); transform: {{ panelShift }}; visibility: {{ panelVis }}; transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.4s;">
  <sc-for list="{{ mlinks }}" as="l" hint-placeholder-count="5">
    <a href="{{ l.href }}" aria-current="{{ l.current }}" style="display: flex; justify-content: space-between; align-items: center; min-height: 52px; border-bottom: 1px solid #e2d8cd; text-decoration: none; font-family: 'Cormorant Garamond', serif; font-size: 23px; font-weight: 600; color: {{ l.color }}; opacity: {{ l.op }}; transform: {{ l.tx }}; transition: opacity 0.4s ease {{ l.delay }}, transform 0.45s cubic-bezier(0.22, 1, 0.36, 1) {{ l.delay }}, padding 0.2s ease;" style-hover="padding-left: 6px; color: #e2673e;">{{ l.label }}<span style="font-family: 'Jost', sans-serif; font-size: 15px; color: #e2673e;">→</span></a>
  </sc-for>
  <div style="margin-top: 20px; display: flex; flex-direction: column; gap: 10px;">
    <a href="Heal%20and%20Learn.dc.html#self-care" style="height: 42px; display: flex; align-items: center; justify-content: center; border: 1px solid #e2673e; border-radius: 99px; color: #e2673e; text-decoration: none; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; transition: background 0.2s ease, color 0.2s ease;" style-hover="background: #e2673e; color: #fff;">{{ careLabel }}</a>
    <a href="Attorneys.dc.html" style="height: 42px; display: flex; align-items: center; justify-content: center; border: 1px solid #2a2320; border-radius: 99px; color: #2a2320; text-decoration: none; font-size: 14px; font-weight: 500; transition: background 0.2s ease, color 0.2s ease;" style-hover="background: #2a2320; color: #f7f2ec;">{{ attyLabel }}</a>
  </div>
  <div style="margin-top: auto; padding-top: 22px; display: flex; flex-direction: column; gap: 2px; font-size: 13px; line-height: 21px; color: #6f625a;">
    <span>{{ crisisLabel }}</span>
    <span><a href="tel:988" style="color: #2a2320; font-weight: 600;">988</a> · <a href="tel:18006564673" style="color: #2a2320; font-weight: 600;">800-656-4673</a> · <a href="tel:911" style="color: #2a2320; font-weight: 600;">911</a></span>
  </div>
</div>
<div style="position: fixed; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 50; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-family: 'Jost', system-ui, sans-serif; transform: {{ barShift }}; transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);">
  <button type="button" onClick="{{ quickExit }}" style="all: unset; cursor: pointer; height: 44px; border-radius: 99px; display: flex; align-items: center; justify-content: center; gap: 6px; background: #c8102e; color: #fff; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; box-shadow: 0 6px 18px rgba(31,26,23,0.22); transition: background 0.2s ease, transform 0.15s ease;" style-hover="background: #a00d25;" style-active="transform: scale(0.96);">{{ exitLabel }} ✕</button>
  <a href="Reach%20Out.dc.html" style="height: 44px; border-radius: 99px; display: flex; align-items: center; justify-content: center; gap: 6px; background: #e2673e; color: #fff; text-decoration: none; font-size: 14px; font-weight: 500; box-shadow: 0 6px 18px rgba(31,26,23,0.22); transition: background 0.2s ease, transform 0.15s ease;" style-hover="background: #c9532c; color: #fff;" style-active="transform: scale(0.96);">{{ talkLabel }} →</a>
</div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;90px&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;what&quot;,&quot;who&quot;,&quot;why&quot;,&quot;heal&quot;,&quot;es&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;es&quot;],&quot;default&quot;:&quot;en&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { wide: true, mobile: false, menu: false, hide: false, scrolled: false };
  componentDidMount() {
    this.mq = window.matchMedia('(min-width: 1180px)');
    this.mm = window.matchMedia('(max-width: 760px)');
    this.onMq = () => this.setState({ wide: this.mq.matches, mobile: this.mm.matches, menu: this.mm.matches ? this.state.menu : false });
    this.onMq();
    this.mq.addEventListener('change', this.onMq);
    this.mm.addEventListener('change', this.onMq);
    this.lastY = window.scrollY;
    this.onScroll = () => {
      const y = window.scrollY, d = y - this.lastY;
      if (Math.abs(d) < 6) return;
      const hide = this.state.mobile && !this.state.menu && d > 0 && y > 120;
      const scrolled = y > 8;
      if (hide !== this.state.hide || scrolled !== this.state.scrolled) this.setState({ hide, scrolled });
      this.lastY = y;
    };
    window.addEventListener('scroll', this.onScroll, { passive: true });
    this.setupReveal();
    this.onKey = e => { if (e.key === 'Escape') this.exit(); };
    window.addEventListener('keydown', this.onKey);
  }
  componentDidUpdate(_, prev) {
    if (prev.menu !== this.state.menu) document.body.style.overflow = this.state.menu ? 'hidden' : '';
  }
  setupReveal() {
    if (!('IntersectionObserver' in window) || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    setTimeout(() => {
      const els = Array.from(document.querySelectorAll('main > section, body section, article')).filter(el => !el.closest('nav') && el.getBoundingClientRect().top > window.innerHeight * 0.9);
      this.io = new IntersectionObserver(entries => entries.forEach(en => {
        if (en.isIntersecting) { en.target.style.opacity = '1'; en.target.style.transform = 'none'; this.io.unobserve(en.target); }
      }), { rootMargin: '0px 0px -8% 0px' });
      els.forEach(el => { el.style.opacity = '0'; el.style.transform = 'translateY(24px)'; el.style.transition = 'opacity 0.7s ease, transform 0.8s cubic-bezier(0.22, 1, 0.36, 1)'; this.io.observe(el); });
    }, 400);
  }
  componentWillUnmount() {
    window.removeEventListener('scroll', this.onScroll);
    this.io && this.io.disconnect();
    window.removeEventListener('keydown', this.onKey);
    this.mq && this.mq.removeEventListener('change', this.onMq);
    this.mm && this.mm.removeEventListener('change', this.onMq);
    document.body.style.overflow = '';
  }
  exit() { window.location.replace('https://www.google.com/search?q=weather'); }
  renderVals() {
    const a = this.props.active || '';
    const es = this.props.lang === 'es';
    const open = this.state.menu;
    const links = [
      ['what', es ? 'Qué pasó' : 'What happened', 'What%20Happened.dc.html'],
      ['who', es ? 'A quién ayudamos' : 'Who we help', 'Who%20We%20Help.dc.html'],
      ['why', es ? 'Por qué Jessica' : 'Why Jessica', 'Why%20Jessica.dc.html'],
      ['heal', es ? 'Sanar y aprender' : 'Heal & learn', 'Heal%20and%20Learn.dc.html'],
      ['es', es ? 'English' : 'Español', es ? 'Survivor%20Lawyer%20Home%20v2.dc.html' : 'Espanol.dc.html'],
    ];
    return {
      desktop: !this.state.mobile, mobile: this.state.mobile,
      menuOpen: open, toggleMenu: () => this.setState(s => ({ menu: !s.menu, hide: false })), closeMenu: () => this.setState({ menu: false }),
      navShift: this.state.hide ? 'translateY(-100%)' : 'none',
      navShadow: this.state.scrolled ? '0 4px 16px rgba(31,26,23,0.08)' : 'none', navBorder: this.state.scrolled ? 'transparent' : '#e2d8cd',
      barShift: this.state.hide ? 'translateY(4px)' : 'none',
      panelShift: open ? 'none' : 'translateX(100%)', panelVis: open ? 'visible' : 'hidden',
      scrimOpacity: open ? 1 : 0, scrimEvents: open ? 'auto' : 'none',
      mlinks: links.map(([k, label, href], i) => ({ label, href, current: k === a ? 'page' : undefined, color: k === a ? '#e2673e' : '#2a2320', op: open ? 1 : 0, tx: open ? 'none' : 'translateX(16px)', delay: (open ? 0.08 + i * 0.05 : 0).toFixed(2) + 's' })),
      bar1: open ? 'translateY(7px) rotate(45deg)' : 'none', bar2: open ? 0 : 1, bar3: open ? 'translateY(-7px) rotate(-45deg)' : 'none',
      quickExit: () => this.exit(),
      linksOrder: this.state.wide ? 1 : 3, linksFlex: this.state.wide ? '1 1 0' : '1 1 100%',
      linksJustify: this.state.wide ? 'space-evenly' : 'space-between', linksBorder: this.state.wide ? '0' : '1px solid #ece3d9',
      links: links.map(([k, label, href]) => ({ label, href, current: k === a ? 'page' : undefined, color: k === a ? '#e2673e' : '#2a2320', line: k === a ? '#e2673e' : 'transparent' })),
      talkLabel: es ? 'Hablar en privado' : 'Talk privately',
      exitLabel: es ? 'SALIDA RÁPIDA' : 'QUICK EXIT',
      escLabel: es ? 'o pulse Esc' : 'or press Esc',
      attyLabel: es ? 'Para abogados' : 'For attorneys',
      reachLabel: es ? 'Contáctenos' : 'Reach out',
      careLabel: es ? 'AUTOCUIDADO GRATIS' : 'FREE SELF-CARE',
      callLabel: es ? 'Llamar' : 'Call',
      crisisLabel: es ? '¿Necesita ayuda ahora mismo?' : 'Need help right now?',
    };
  }
}
</script>
</body>
</html>
